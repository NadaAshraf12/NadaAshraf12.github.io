<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · writeups{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" class="brand"><span class="hash">0x</span>{{ site.title | remove: '0x' | upcase }}<span class="cursor"></span></a>
    <nav class="nav-links">
      <a href="{{ '/' | relative_url }}">~/home</a>
      <a href="{{ '/' | relative_url }}">writeups</a>
      <a href="{{ '/about/' | relative_url }}">about</a>
      {% if site.medium_url %}<a href="{{ site.medium_url }}" class="me" target="_blank" rel="noopener">medium ↗</a>{% endif %}
    </nav>
  </div>
</header>

{{ content }}

<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
